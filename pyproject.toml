[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nkhardy-fmtstable"
version = "0.1.0"
description = "从输入中抽取数值，计算模型的格式稳定性相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "nkhardy" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://nkhardy.github.io"
Repository = "https://github.com/nkhardy/fmtstable"
Issues = "https://github.com/nkhardy/fmtstable/issues"

[project.scripts]
fmtstable = "fmtstable:main"

[tool.setuptools]
py-modules = ["fmtstable"]
